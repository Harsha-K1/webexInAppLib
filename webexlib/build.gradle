plugins {
    id 'com.android.library'
}

android {
    namespace 'com.webexinapp.lib'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Intentionally no dependencies: keeps the AAR free of version clashes with
// the libraries already bundled by the Volt MX Android build.
