plugins {
    id 'com.android.library'
}

android {
    namespace 'com.webexinapp.lib'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    libraryVariants.configureEach { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.configureEach { output ->
                outputFileName = "webexlib.aar"
            }
        }
    }
}

// Intentionally no dependencies: keeps the AAR free of version clashes with
// the libraries already bundled by the Volt MX Android build.

// After every release build, copy the AAR into the VoltMX project's native libs folder.
// Set voltmxLibDir in ~/.gradle/gradle.properties (kept out of git),
// or override per build with -PvoltmxLibDir=/other/path
def voltmxLibDir = project.findProperty('voltmxLibDir')

tasks.register('copyAarToVoltMX', Copy) {
    onlyIf { voltmxLibDir != null }
    from layout.buildDirectory.file('outputs/aar/LiveUpdateNFILib.aar')
    into voltmxLibDir ?: layout.buildDirectory.dir('unusedCopyDestination')
    doFirst { println "Copying LiveUpdateNFILib.aar -> ${voltmxLibDir}" }
}

afterEvaluate {
    tasks.named('assembleRelease') { finalizedBy 'copyAarToVoltMX' }
}
